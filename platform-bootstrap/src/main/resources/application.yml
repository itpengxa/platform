# =============================================================================
# platform 公共配置（无环境敏感值）
# 切换环境：改 spring.profiles.active = test | online
# 或启动参数：--spring.profiles.active=online
# =============================================================================
server:
  port: 8088

# info / error 分文件，见 logback-spring.xml；可用环境变量 LOG_PATH 覆盖目录
logging:
  file:
    path: ${LOG_PATH:./logs}

spring:
  application:
    name: platform
  profiles:
    active: test
    # --spring.profiles.active=prod 时同时激活 online 完整配置
    group:
      prod: online
  threads:
    virtual:
      enabled: true
  messages:
    basename: messages
    encoding: UTF-8

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

platform:
  geo:
    cache:
      redis-enabled: true
      l1-maximum-size: 10000
      l1-ttl-minutes: 10
      countries-ttl-hours: 24
      children-ttl-hours: 24
      path-ttl-hours: 24
      region-ttl-hours: 24
      tree-ttl-hours: 12
      # L2 TTL 随机抖动上限（秒），防缓存雪崩
      jitter-seconds: 300
      # miss 负缓存 TTL（秒），防穿透
      negative-ttl-seconds: 30
      # 树查询最大行数：命中上限视为可能截断，拒绝返回（VN depth4≈1.2万，默认放宽）
      tree-max-rows: 500000
      # 国家级根（未传 rootId / level=1）允许的最大 depth（1~5）；请求更大时封顶
      # 例：4=国→省→市→区；5=可到街镇（数据量大，配合 tree-max-rows）
      tree-country-max-depth: 4
    rate-limit:
      # 独立开关：false 则完全跳过 IP 限流
      enabled: true
      # 默认不信任 XFF，防客户端伪造绕过限流；仅经可信网关时改为 true
      trust-forwarded-headers: false
      # Redis 不可用时是否拒绝（多实例建议 online 开启）
      fail-closed: false
      default-interval-ms: 1000
      # 搜索直打 DB，独立桶按 IP 1qps
      search-interval-ms: 1000
      tree-interval-ms: 2000
    auth:
      # 独立开关：false 则跳过 Token 校验
      enabled: false
      # 签发密钥：非空时 Issue 必须带 Header X-Platform-Issue-Secret；online 强制非空
      # 本地默认值仅供联调，online 请用环境变量 PLATFORM_GEO_ISSUE_SECRET 覆盖
      issue-secret: ${PLATFORM_GEO_ISSUE_SECRET:local-dev-issue-secret}
      # Redis：Issue 分布式锁 + valid:{hash}（依赖 cache.redis-enabled 与 Redis 可用）
      redis-token-sync-enabled: true
      issue-lock-key-prefix: "platform:auth:issue-lock:"
      valid-key-prefix: "platform:auth:valid:"
      issue-lock-seconds: 60
      issue-lock-retry-times: 8
      issue-lock-retry-ms: 50
      valid-ttl-days: 365
    access-log:
      args-enabled: true
      exception-enabled: true
      stat-enabled: true
      params-max-length: 2048
