server:
  port: 8088

spring:
  application:
    name: platform
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: platform
    password: platform
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 3s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false

platform:
  geo:
    cache:
      # false 时仅 L1+DB；L2 Redis 读写异常时自动降级
      redis-enabled: true

logging:
  level:
    com.caopan.platform: INFO
    com.caopan.platform.geo.mapper: DEBUG
    com.caopan.platform.geo.cache: DEBUG
