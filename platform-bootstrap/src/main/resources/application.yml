# =============================================================================
# platform 公共配置（无环境敏感值）
# 切换环境：改 spring.profiles.active = test | online
# 或启动参数：--spring.profiles.active=online
# =============================================================================
server:
  port: 8088

spring:
  application:
    name: platform
  profiles:
    active: test
    # --spring.profiles.active=prod 时同时激活 online 完整配置
    group:
      prod: online
  threads:
    virtual:
      enabled: true
  messages:
    basename: messages
    encoding: UTF-8

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

platform:
  geo:
    cache:
      redis-enabled: true
      l1-maximum-size: 10000
      l1-ttl-minutes: 10
      countries-ttl-hours: 24
      children-ttl-hours: 24
      path-ttl-hours: 24
      region-ttl-hours: 24
      tree-ttl-hours: 12
      # L2 TTL 随机抖动上限（秒），防缓存雪崩
      jitter-seconds: 300
      # miss 负缓存 TTL（秒），防穿透
      negative-ttl-seconds: 30
      # 树查询最大行数硬限制
      tree-max-rows: 3000
    rate-limit:
      enabled: true
      # 默认不信任 XFF，防客户端伪造绕过限流；仅经可信网关时改为 true
      trust-forwarded-headers: false
      # Redis 不可用时是否拒绝（多实例建议 online 开启）
      fail-closed: false
      default-interval-ms: 1000
      tree-interval-ms: 2000
    auth:
      # online 建议 true；test 默认 false
      enabled: false
      token: ""
