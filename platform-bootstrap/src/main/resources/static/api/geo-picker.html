<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
  <meta http-equiv="Pragma" content="no-cache"/>
  <title>选择地区</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; }
    body.embed-full { background: #f5f5f5; }
  </style>
</head>
<body>
<script src="geo-picker-1.1.7.js"></script>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var embed = q.get('embed') !== '0';
  var keepOpen = q.get('autoClose') === '0';
  if (embed) document.body.classList.add('embed-full');

  if (!window.PlatformGeoPicker || PlatformGeoPicker.version !== '1.1.7') {
    document.body.innerHTML = '<div style="padding:24px;color:#cf1322;font:14px sans-serif">选择器脚本未加载到 v1.1.7，请强制刷新（Cmd+Shift+R）。当前：'
      + (window.PlatformGeoPicker && PlatformGeoPicker.version ? PlatformGeoPicker.version : 'missing') + '</div>';
    return;
  }

  var cfg = {
    clientCode: q.get('clientCode') || 'embed',
    clientName: q.get('clientName') || q.get('clientCode') || 'H5 Embed',
    lang: q.get('lang') || 'en',
    apiBase: q.get('apiBase') || '',
    // 宿主代签后注入的 token（优先使用，不再自动签发）；无 token 且未配 issueSecret 时，失效会通知宿主刷新
    token: q.get('token') || '',
    // issueSecret 仅当显式传入才启用自动签发；默认空 = 不自动签发（避免误用旧弱密钥导致 401）
    issueSecret: q.get('issueSecret') || '',
    primaryColor: q.get('primaryColor') || '#e1251b',
    keepOpen: keepOpen,
    onConfirm: function () {
      if (!keepOpen) {
        try { history.back(); } catch (e) {}
      }
    },
    onCancel: function () {
      if (!keepOpen) {
        try { history.back(); } catch (e) {}
      }
    }
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { PlatformGeoPicker.open(cfg); });
  } else {
    PlatformGeoPicker.open(cfg);
  }
})();
</script>
</body>
</html>
