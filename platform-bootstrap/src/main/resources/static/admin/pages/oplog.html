<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <title>操作日志</title>
  <style>
    :root {
      --bg: #f0f2f5; --card: #fff; --line: #e8ecf0; --text: #1f2329; --muted: #8a9199;
      --subtle: #646a73; --primary: #1677ff; --primary-soft: #e8f3ff; --ok: #389e0d;
      --danger: #cf1322; --warn: #d48806; --radius: 10px;
      --shadow: 0 1px 2px rgba(31,35,41,.04), 0 4px 12px rgba(31,35,41,.04);
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB',
        'Microsoft YaHei', sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 20px 22px 28px; font-family: var(--font); background: var(--bg);
      color: var(--text); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased;
    }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
      box-shadow: var(--shadow); margin-bottom: 14px; overflow: hidden;
    }
    .card-hd {
      padding: 14px 18px; border-bottom: 1px solid var(--line); background: #fafbfc;
      display: flex; align-items: center; gap: 8px;
    }
    .card-hd h3 {
      margin: 0; font-size: 15px; font-weight: 600;
      display: flex; align-items: center; gap: 8px;
    }
    .card-hd h3::before {
      content: ''; width: 3px; height: 14px; border-radius: 2px; background: var(--primary);
    }
    .card-bd { padding: 16px 18px; }
    .filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field > span { font-size: 12px; color: var(--subtle); font-weight: 500; }
    input, select {
      height: 36px; padding: 0 11px; border: 1px solid #d0d5dd; border-radius: 8px;
      font: inherit; outline: none; background: #fff;
    }
    input:focus, select:focus {
      border-color: var(--primary); box-shadow: 0 0 0 3px rgba(22,119,255,.15);
    }
    .btn {
      height: 36px; padding: 0 16px; border: none; border-radius: 8px; cursor: pointer;
      font: inherit; font-size: 13px; font-weight: 550; background: var(--primary); color: #fff;
    }
    .btn:hover { background: #0958d9; }
    .btn-secondary {
      background: #fff; color: var(--text); border: 1px solid #d0d5dd;
    }
    .btn-secondary:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
    .msg { display: none; margin-bottom: 12px; padding: 10px 14px; border-radius: 8px; font-size: 13px; border: 1px solid transparent; }
    .msg.show { display: block; }
    .msg.ok { background: #f6ffed; color: var(--ok); border-color: #b7eb8f; }
    .msg.err { background: #fff2f0; color: var(--danger); border-color: #ffccc7; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 10px 12px; border-bottom: 1px solid #f0f2f5; text-align: left; vertical-align: top; }
    th { background: #fafbfc; color: var(--subtle); font-weight: 600; font-size: 12px; }
    .mono { font-family: var(--mono); font-size: 12px; word-break: break-all; }
    .pill {
      display: inline-flex; align-items: center; height: 22px; padding: 0 8px;
      border-radius: 999px; font-size: 11px; font-weight: 600;
    }
    .pill.ok { background: #f6ffed; color: var(--ok); }
    .pill.fail { background: #fff2f0; color: var(--danger); }
    .pill.mod { background: var(--primary-soft); color: var(--primary); }
    .summary { max-width: 280px; color: var(--subtle); }
    .expand {
      margin-top: 6px; font-size: 12px; color: var(--primary); cursor: pointer;
      background: none; border: none; padding: 0; font: inherit;
    }
    .detail {
      display: none; margin-top: 8px; padding: 10px; background: #0f1419; color: #d6deea;
      border-radius: 8px; font-family: var(--mono); font-size: 12px; white-space: pre-wrap;
      word-break: break-word;
    }
    .detail.show { display: block; }
    .empty { padding: 36px; text-align: center; color: var(--muted); }
    .hint { margin: 0; font-size: 12px; color: var(--muted); }
  </style>
  <script src="../common/http.js"></script>
  <script src="../common/pager.js"></script>
</head>
<body>
<div id="msg" class="msg"></div>

<section class="card">
  <div class="card-hd">
    <h3>操作日志</h3>
    <span class="hint" style="margin-left:auto">含耗时 costMs，便于性能排查</span>
  </div>
  <div class="card-bd">
    <div class="filters">
      <label class="field">
        <span>模块</span>
        <select id="module">
          <option value="">全部</option>
          <option value="region">region 区划</option>
          <option value="config">config 配置</option>
          <option value="cache">cache 缓存</option>
          <option value="client">client 接入方</option>
          <option value="token">token Token</option>
          <option value="admin">admin 管理员</option>
          <option value="report">report 上报审批</option>
        </select>
      </label>
      <label class="field">
        <span>操作人</span>
        <input id="operator" placeholder="admin" style="width:120px"/>
      </label>
      <label class="field">
        <span>关键词</span>
        <input id="keyword" placeholder="资源 / 摘要 / 动作" style="width:180px"/>
      </label>
      <label class="field">
        <span>开始时间</span>
        <input id="from" type="datetime-local"/>
      </label>
      <label class="field">
        <span>结束时间</span>
        <input id="to" type="datetime-local"/>
      </label>
      <button class="btn" type="button" onclick="search()">查询</button>
      <button class="btn btn-secondary" type="button" onclick="resetFilters()">重置</button>
    </div>
  </div>
</section>

<section class="card">
  <div class="card-bd" style="padding-top:8px">
    <div id="tableWrap"></div>
  </div>
</section>
<div id="pager"></div>

<script>
  const pager = AdminPager.mount('pager', {
    pageSize: 10,
    sizeOptions: [10, 20, 50, 100],
    onChange: () => load()
  });

  function showMsg(text, type) {
    const el = document.getElementById('msg');
    el.textContent = text;
    el.className = 'msg show ' + (type || 'ok');
  }

  function fmtTs(v) {
    if (!v) return '-';
    return String(v).replace('T', ' ').slice(0, 19);
  }

  function toApiTs(localValue) {
    if (!localValue) return '';
    return localValue.replace('T', ' ') + (localValue.length === 16 ? ':00' : '');
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function search() {
    pager.reset();
    load();
  }

  function resetFilters() {
    document.getElementById('module').value = '';
    document.getElementById('operator').value = '';
    document.getElementById('keyword').value = '';
    document.getElementById('from').value = '';
    document.getElementById('to').value = '';
    search();
  }

  async function load() {
    const q = new URLSearchParams({
      pageNum: pager.pageNum,
      pageSize: pager.pageSize
    });
    const module = document.getElementById('module').value;
    const operator = document.getElementById('operator').value.trim();
    const keyword = document.getElementById('keyword').value.trim();
    const from = toApiTs(document.getElementById('from').value);
    const to = toApiTs(document.getElementById('to').value);
    if (module) q.set('module', module);
    if (operator) q.set('operator', operator);
    if (keyword) q.set('keyword', keyword);
    if (from) q.set('from', from);
    if (to) q.set('to', to);

    try {
      const page = await AdminHttp.api('/admin/platform/v1/operation-logs?' + q.toString());
      pager.apply(page);
      renderTable(page.list || []);
    } catch (e) {
      showMsg(e.message || '加载失败', 'err');
    }
  }

  function renderTable(list) {
    const wrap = document.getElementById('tableWrap');
    if (!list.length) {
      wrap.innerHTML = '<div class="empty">暂无操作日志</div>';
      return;
    }
    wrap.innerHTML =
      '<table><thead><tr>' +
      '<th>时间</th><th>模块</th><th>动作</th><th>资源</th><th>操作人</th><th>结果</th><th>耗时</th><th>摘要</th>' +
      '</tr></thead><tbody>' +
      list.map((row, idx) => {
        const detailId = 'd' + idx;
        const hasDetail = row.beforeData || row.afterData || row.errorMsg || row.clientIp;
        return '<tr>' +
          '<td>' + esc(fmtTs(row.createdAt)) + '</td>' +
          '<td><span class="pill mod">' + esc(row.module) + '</span></td>' +
          '<td>' + esc(row.action) + '</td>' +
          '<td class="mono">' + esc(row.resourceType) + (row.resourceId ? '<br/>' + esc(row.resourceId) : '') + '</td>' +
          '<td>' + esc(row.operator || '-') + '</td>' +
          '<td><span class="pill ' + (row.success ? 'ok' : 'fail') + '">' + (row.success ? '成功' : '失败') + '</span></td>' +
          '<td class="mono">' + (row.costMs == null ? '-' : (row.costMs + 'ms')) + '</td>' +
          '<td class="summary">' + esc(row.requestSummary || '-') +
          (hasDetail
            ? '<br/><button type="button" class="expand" data-target="' + detailId + '">展开详情</button>' +
              '<div class="detail" id="' + detailId + '">' +
              'ip: ' + esc(row.clientIp || '-') + '\n' +
              (row.errorMsg ? ('error: ' + esc(row.errorMsg) + '\n') : '') +
              (row.beforeData ? ('before:\n' + esc(row.beforeData) + '\n') : '') +
              (row.afterData ? ('after:\n' + esc(row.afterData)) : '') +
              '</div>'
            : '') +
          '</td></tr>';
      }).join('') +
      '</tbody></table>';

    wrap.querySelectorAll('.expand').forEach(btn => {
      btn.addEventListener('click', () => {
        const el = document.getElementById(btn.dataset.target);
        const open = el.classList.toggle('show');
        btn.textContent = open ? '收起详情' : '展开详情';
      });
    });
  }

  load().catch(e => showMsg(e.message || '加载失败', 'err'));
</script>
</body>
</html>
