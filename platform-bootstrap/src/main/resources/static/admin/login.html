<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>GEO 管理登录</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(160deg, #e8f3ff 0%, #f5f7fa 45%, #fff 100%);
      color: #333;
    }
    .card {
      width: 380px; background: #fff; border: 1px solid #e8e8e8; border-radius: 8px;
      padding: 32px 28px; box-shadow: 0 8px 24px rgba(22,119,255,.08);
    }
    h1 { margin: 0 0 8px; font-size: 22px; color: #1677ff; }
    .sub { margin: 0 0 24px; color: #888; font-size: 13px; }
    label { display: block; font-size: 13px; color: #666; margin: 12px 0 6px; }
    input {
      width: 100%; padding: 10px 12px; border: 1px solid #d9d9d9; border-radius: 6px;
      font-size: 14px; outline: none;
    }
    input:focus { border-color: #1677ff; box-shadow: 0 0 0 2px rgba(22,119,255,.15); }
    button {
      width: 100%; margin-top: 20px; padding: 10px 12px; border: none; border-radius: 6px;
      background: #1677ff; color: #fff; font-size: 15px; cursor: pointer;
    }
    button:hover { background: #4096ff; }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .err { color: #cf1322; font-size: 13px; margin-top: 12px; min-height: 18px; }
    .hint { margin-top: 16px; font-size: 12px; color: #999; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="card">
    <h1>GEO 管理控制台</h1>
    <p class="sub">请使用管理员账号登录</p>
    <label>用户名</label>
    <input id="username" autocomplete="username" value="admin"/>
    <label>密码</label>
    <input id="password" type="password" autocomplete="current-password"/>
    <button id="btn" onclick="doLogin()">登录</button>
    <div class="err" id="err"></div>
    <div class="hint">初始账号：admin / admin（首次启动自动创建，请登录后尽快修改密码）</div>
  </div>
  <script src="common/http.js"></script>
  <script>
    function adminHome() {
      const redirect = new URLSearchParams(location.search).get('redirect');
      if (redirect && redirect.charAt(0) === '/') return redirect;
      return '/admin/';
    }
    if (AdminHttp.getToken()) {
      location.href = adminHome();
    }
    async function doLogin() {
      const err = document.getElementById('err');
      const btn = document.getElementById('btn');
      err.textContent = '';
      btn.disabled = true;
      try {
        await AdminHttp.login(
          document.getElementById('username').value.trim(),
          document.getElementById('password').value
        );
        location.href = adminHome();
      } catch (e) {
        err.textContent = e.message || '登录失败';
      } finally {
        btn.disabled = false;
      }
    }
    document.getElementById('password').addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });
  </script>
</body>
</html>
