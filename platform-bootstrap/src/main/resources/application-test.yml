# =============================================================================
# test 环境（本地/联调）
# 激活：spring.profiles.active=test
# =============================================================================
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: platform
    password: platform
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 3s
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

platform:
  geo:
    cache:
      redis-enabled: true
      jitter-seconds: 120
      # 本地联调：允许更深树 / 更大结果，方便验证；online 仍用 application.yml 严格值
      tree-country-max-depth: 5
      tree-max-rows: 50000
    rate-limit:
      # 本地联调/前端轮询易触发 1qps；test 放宽。online 仍用 application.yml/online 严格值
      # 独立开关：设 false 可完全关闭限流
      enabled: true
      trust-forwarded-headers: false
      fail-closed: false
      default-interval-ms: 100
      search-interval-ms: 100
      tree-interval-ms: 200
    auth:
      enabled: false
      redis-token-sync-enabled: true
      issue-lock-seconds: 60
      valid-ttl-days: 365
      issue-secret: local-dev-issue-secret
    access-log:
      args-enabled: true
      exception-enabled: true
      stat-enabled: true
      params-max-length: 2048

logging:
  level:
    com.caopan.platform: INFO
    com.caopan.platform.geo.mapper: DEBUG
    com.caopan.platform.geo.cache: DEBUG
