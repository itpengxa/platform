<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEO API 调试器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0d1117;color:#c9d1d9;height:100vh;display:flex;flex-direction:column}
header{background:#161b22;border-bottom:1px solid #30363d;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0}
header h1{font-size:15px;font-weight:600;color:#f0f6fc;white-space:nowrap}
.container{display:flex;flex:1;overflow:hidden}

/* 三列布局 */
.col{display:flex;flex-direction:column;overflow:hidden;border-right:1px solid #30363d}
.col-cascade{width:240px;min-width:240px;background:#0d1117}
.col-tree{width:320px;min-width:280px;background:#0d1117}
.col-json{flex:1;background:#161b22}

.col-header{padding:6px 10px;font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #30363d;flex-shrink:0}
.col-body{flex:1;overflow-y:auto}

/* Cascade selectors */
.cascade-select{padding:4px 8px}
.cascade-select label{display:block;font-size:10px;color:#8b949e;margin:4px 0 2px;text-transform:uppercase;letter-spacing:.3px}
.cascade-select select{width:100%;padding:5px 6px;background:#21262d;border:1px solid #30363d;border-radius:3px;color:#c9d1d9;font-size:11px;outline:none;cursor:pointer}
.cascade-select select:focus{border-color:#58a6ff}
.cascade-select select:disabled{opacity:.4;cursor:not-allowed}

/* Tree */
.tree-row{display:flex;align-items:center;gap:3px;padding:2px 4px;border-radius:3px;cursor:pointer}
.tree-row:hover{background:#1f2d3d}
.tree-row .toggle{width:14px;height:14px;display:inline-flex;align-items:center;justify-content:center;font-size:8px;color:#8b949e;cursor:pointer;flex-shrink:0;user-select:none;border-radius:2px}
.tree-row .toggle:hover{background:#30363d;color:#f0f6fc}
.tree-row .toggle.leaf{visibility:hidden}
.tree-row .node-name{color:#f0f6fc;font-size:12px}
.tree-row .node-tag{font-size:8px;padding:1px 4px;border-radius:6px;margin-left:3px}
.tree-row .node-count{font-size:9px;color:#8b949e;margin-left:3px}
.tree-children{margin-left:16px;border-left:1px solid #30363d;padding-left:3px}
.tree-children.collapsed{display:none}
.tree-node.highlight>.tree-row{background:#1a3a5c}

/* JSON */
.json-tabs{display:flex;border-bottom:1px solid #30363d;background:#0d1117;flex-shrink:0}
.json-tabs button{padding:6px 12px;background:0 0;border:none;border-bottom:2px solid transparent;color:#8b949e;cursor:pointer;font-size:11px}
.json-tabs button.active{color:#f0f6fc;border-bottom-color:#58a6ff}
.json-tabs .tab-meta{margin-left:auto;padding:6px 12px;font-size:10px;color:#8b949e}
.json-body{flex:1;overflow:auto;padding:8px;font-size:11px;line-height:1.5;white-space:pre-wrap;word-break:break-all;font-family:monospace}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#484f58;font-size:13px;gap:6px}
.loading{padding:20px;text-align:center;color:#484f58;font-size:12px}
.json-key{color:#79c0ff}.json-string{color:#a5d6ff}.json-number{color:#79c0ff}.json-bool{color:#d2a8ff}.json-null{color:#8b949e}

/* Search */
.search-bar{padding:6px 8px;border-bottom:1px solid #30363d;display:flex;gap:4px}
.search-bar input{flex:1;padding:4px 6px;background:#21262d;border:1px solid #30363d;border-radius:3px;color:#c9d1d9;font-size:11px;outline:none}
.search-bar input:focus{border-color:#58a6ff}
.search-bar button{padding:4px 8px;background:#1f6feb;border:none;border-radius:3px;color:#fff;font-size:10px;cursor:pointer}
.search-res{max-height:150px;overflow-y:auto;border-bottom:1px solid #30363d;background:#161b22;display:none}
.search-res .sr{padding:4px 8px;font-size:11px;cursor:pointer;border-bottom:1px solid #21262d}
.search-res .sr:hover{background:#1f2d3d}

@media(max-width:1100px){.col-cascade{width:200px;min-width:180px}.col-tree{width:240px;min-width:200px}}
</style>
</head>
<body>
<header>
  <h1>🌍 GEO API 调试器</h1>
  <div style="display:flex;align-items:center;gap:8px;font-size:11px;color:#8b949e">
    <span>代理 → localhost:8088</span>
    <span style="color:#30363d">|</span>
    <label><span>语言:</span>
      <select id="langSelect" onchange="onLangChange()" style="padding:2px 5px;background:#21262d;border:1px solid #30363d;border-radius:3px;color:#c9d1d9;font-size:11px;outline:none">
        <option value="">默认</option><option value="zh">中文</option><option value="en">English</option>
      </select>
    </label>
    <a href="javascript:location.reload()" style="color:#58a6ff;text-decoration:none">刷新</a>
  </div>
</header>
<div class="container">
  <!-- Column 1: Cascading -->
  <div class="col col-cascade">
    <div class="col-header">⬇ 逐级选择</div>
    <div class="col-body" id="cascadeBody"></div>
  </div>
  <!-- Column 2: Tree -->
  <div class="col col-tree">
    <div class="col-header">🌳 树状展开</div>
    <div class="search-bar">
      <input id="searchInput" placeholder="搜索..." onkeydown="if(event.key==='Enter')doSearch()">
      <button onclick="doSearch()">搜</button>
    </div>
    <div class="search-res" id="searchRes"></div>
    <div class="col-body" id="treeBody"><div class="loading">选中国家</div></div>
  </div>
  <!-- Column 3: JSON -->
  <div class="col col-json">
    <div class="json-tabs">
      <button id="tabResponse" class="active" onclick="switchTab('response')">📄 响应</button>
      <button id="tabRequest" onclick="switchTab('request')">📤 请求</button>
      <button id="tabPath" onclick="switchTab('path')">🗺️ 祖先链</button>
      <span class="tab-meta" id="tabMeta">等待请求...</span>
    </div>
    <div class="json-body" id="jsonBody"><div class="empty"><div>🔌</div><div>选择国家或点击树节点</div></div></div>
  </div>
</div>
<script>
const TAG_COLORS={COUNTRY:'#58a6ff',PROVINCE:'#3fb950',STATE:'#3fb950',CITY:'#d29922',DISTRICT:'#db6d28',WARD:'#f85149'};
const LEVEL_NAMES=['国家','省/州','城市','区/县','街道/镇','6','7','8'];
let countryMeta={};let currentTab='response';let lastPathData=null;

function getBase(){return ''}
function getLang(){return document.getElementById('langSelect').value}
async function af(path){
  const lang=getLang();const sep=path.includes('?')?'&':'?';const url=getBase()+path+sep+'lang='+lang;
  const r=await fetch(url,{headers:{'Accept':'application/json'}});
  if(!r.ok){let b='';try{b=await r.text()}catch(e){}throw new Error('HTTP '+r.status+': '+b.slice(0,200));}
  const d=await r.json();
  if(d.code!==undefined&&d.code!==null){if(d.code!==0)throw new Error('业务错误 '+d.code+': '+d.message);return d.data||[];}
  return d;
}
function sh(j){j=j.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  return j.replace(/"((?:[^"\\]|\\.)*)"\s*:/g,'<span class="json-key">"$1"</span>:').replace(/:\s*"((?:[^"\\]|\\.)*)"/g,':<span class="json-string">"$1"</span>').replace(/\b(-?\d+\.?\d*)\b/g,'<span class="json-number">$1</span>').replace(/\b(true|false)\b/g,'<span class="json-bool">$1</span>').replace(/\bnull\b/g,'<span class="json-null">null</span>');}

// ===== Init & Country =====
let cascadeSelections={}; // {level: id}

async function init(){
  buildCascadeHTML();
  try{
    const d=await af('/api/geo/v1/countries');
    countryMeta={};
    const sel=document.getElementById('sel-0');
    sel.innerHTML='<option value="">-- 选择国家 --</option>';
    d.forEach(c=>{
      countryMeta[c.id]={iso2:c.iso2};
      const o=document.createElement('option');o.value=c.id;
      o.textContent=(c.displayName||c.nameCh||c.name||c.nameEn)+' ('+c.iso2+')';sel.appendChild(o);
    });
    sel.disabled=false;
    showJson(d,'GET /api/geo/v1/countries');
    showMeta('GET /api/geo/v1/countries → '+d.length+' 国家');
  }catch(e){showMeta('❌ '+e.message,true);}
}

function buildCascadeHTML(){
  let h='<div class="cascade-select" style="padding-top:8px">';
  for(let i=0;i<5;i++){
    const ph=i===0?'加载中...':'请先选择上一级';
    h+=`<label style="color:${['#58a6ff','#3fb950','#d29922','#db6d28','#f85149'][i]}">${LEVEL_NAMES[i]||'L'+(i+1)}</label>
        <select id="sel-${i}" onchange="onCascade(${i})" ${i>0?'disabled':''}><option value="">${ph}</option></select>`;
  }
  h+='</div>';
  document.getElementById('cascadeBody').innerHTML=h;
}

// ===== Cascade =====
async function onCascade(level){
  const sel=document.getElementById('sel-'+level);const val=sel.value;
  for(let i=level+1;i<5;i++){const s=document.getElementById('sel-'+i);s.innerHTML='<option value="">请先选择上一级</option>';s.disabled=true;}
  if(!val){delete cascadeSelections[level];return;}
  cascadeSelections[level]=parseInt(val);
  
  // 显示 JSON
  try{
    const children=await af('/api/geo/v1/regions/children?parentId='+val);
    let pathData=[];try{pathData=await af('/api/geo/v1/regions/'+val+'/path');}catch(e){}
    lastPathData=pathData;
    showJson({selected:{id:parseInt(val),level},children:children.slice(0,100),childrenTotal:children.length,path:pathData},
      'GET /api/geo/v1/regions/children?parentId='+val);
    showMeta('📍 L'+(level+1)+' | 子级:'+children.length+(pathData.length?' path:'+pathData.length+'级':''));
    
    if(children.length===0)return;
    const ns=document.getElementById('sel-'+(level+1));
    if(!ns)return;
    ns.innerHTML='<option value="">-- 选择下级 --</option>';ns.disabled=false;
    children.forEach(r=>{
      const o=document.createElement('option');o.value=r.id;
      o.textContent=(r.displayName||r.nameCh||r.name||r.nameEn)+' ['+r.regionType+']'+(r.isLeaf?'·末级':'');
      o.dataset.isLeaf=r.isLeaf?'1':'0';ns.appendChild(o);
    });
  }catch(e){showJson({error:e.message},null);}
}

// ===== Tree =====
async function onCountryChange(iso2){
  const tree=document.getElementById('treeBody');
  tree.innerHTML='<div class="loading">🌳 加载中...</div>';
  try{
    const data=await af('/api/geo/v1/regions/tree?countryCode='+iso2+'&depth=5');
    tree.innerHTML='';tree.appendChild(buildNode(data,0));
  }catch(e){tree.innerHTML='<div class="loading" style="color:#f85149">❌ '+e.message+'</div>';}
}

function buildNode(node,level){
  const w=document.createElement('div');w.className='tree-node';w.dataset.id=node.id;w.dataset.level=node.level||level;
  const row=document.createElement('div');row.className='tree-row';row.style.paddingLeft=(level*16)+'px';
  const tg=document.createElement('span');const hasCh=node.children&&node.children.length>0;
  tg.className='toggle'+(hasCh?'':' leaf');tg.textContent='▸';row.appendChild(tg);
  const nm=document.createElement('span');nm.className='node-name';
  nm.textContent=node.displayName||node.nameCh||node.name||node.nameEn||('#'+node.id);row.appendChild(nm);
  const tag=document.createElement('span');tag.className='node-tag';
  const tt=node.regionType||('L'+(node.level||level));const tc=TAG_COLORS[tt]||'#8b949e';
  tag.style.cssText='background:'+tc+'33;color:'+tc;tag.textContent=tt;row.appendChild(tag);
  if(hasCh){const ct=document.createElement('span');ct.className='node-count';ct.textContent=node.children.length+'';row.appendChild(ct);}
  w.appendChild(row);
  if(hasCh){
    const cc=document.createElement('div');cc.className='tree-children';
    node.children.forEach(c=>cc.appendChild(buildNode(c,level+1)));w.appendChild(cc);
    tg.onclick=function(e){e.stopPropagation();cc.classList.toggle('collapsed');tg.textContent=cc.classList.contains('collapsed')?'▸':'▾';};
  }
  row.onclick=function(e){if(e.target.classList.contains('toggle'))return;treeSelect(node,level,row);};
  return w;
}

async function treeSelect(node,level,rowEl){
  const nm=node.displayName||node.nameCh||node.name||node.nameEn;
  document.querySelectorAll('#treeBody .tree-node.highlight').forEach(el=>el.classList.remove('highlight'));
  if(rowEl)rowEl.closest('.tree-node').classList.add('highlight');
  try{
    const children=await af('/api/geo/v1/regions/children?parentId='+node.id);
    let pathData=[];try{pathData=await af('/api/geo/v1/regions/'+node.id+'/path');}catch(e){}
    lastPathData=pathData;
    showJson({selected:{id:node.id,name:nm,level:node.level},children:children.slice(0,100),childrenTotal:children.length,path:pathData},
      'GET /api/geo/v1/regions/children?parentId='+node.id);
    showMeta('📍 '+nm+' | 子级:'+children.length+(pathData.length?' path:'+pathData.length+'级':''));
    switchTab('response');
  }catch(e){showJson({error:e.message},null);}
}

// ===== JSON/Render =====
function showJson(data,title){
  const body=document.getElementById('jsonBody');
  let c=title?'/* '+title+' */\n\n':'';c+=sh(JSON.stringify(data,null,2));
  body.innerHTML=c;body.dataset.rawData=JSON.stringify(data,null,2);body.dataset.requestPath=title||'';
}
function showMeta(t,e){const el=document.getElementById('tabMeta');el.textContent=t;el.style.color=e?'#f85149':'#8b949e';}

function switchTab(tab){
  currentTab=tab;document.querySelectorAll('.json-tabs button').forEach(b=>b.classList.remove('active'));
  const ids={response:'tabResponse',request:'tabRequest',path:'tabPath'};
  const el=document.getElementById(ids[tab]||'tabResponse');if(el)el.classList.add('active');
  const body=document.getElementById('jsonBody');
  if(tab==='response'){
    if(body.dataset.rawData){body.innerHTML=sh(body.dataset.rawData);}
  }else if(tab==='request'){
    body.innerHTML='<span style="color:#8b949e">// 请求信息</span>\n\n<span class="json-key">"method"</span>: <span class="json-string">"GET"</span>\n<span class="json-key">"url"</span>: <span class="json-string">"'+body.dataset.requestPath+'"</span>\n\n<span style="color:#8b949e">// 请求头</span>\n<span class="json-key">"Accept"</span>: <span class="json-string">"application/json"</span>';
  }else if(tab==='path'){
    if(lastPathData&&lastPathData.length>0)body.innerHTML=sh(JSON.stringify(lastPathData,null,2));
    else body.innerHTML='<span style="color:#8b949e">// 点击节点查看祖先链</span>';
  }
}

// ===== Search =====
async function doSearch(){
  const inp=document.getElementById('searchInput');const kw=inp.value.trim();if(!kw)return;
  const rd=document.getElementById('searchRes');rd.style.display='block';rd.innerHTML='<div class="sr">搜索中...</div>';
  try{
    const d=await af('/api/geo/v1/regions/search?keyword='+encodeURIComponent(kw)+'&limit=20');
    showJson(d,'GET /api/geo/v1/regions/search?keyword='+encodeURIComponent(kw));
    if(!d.length){rd.innerHTML='<div class="sr" style="color:#8b949e">无结果</div>';return;}
    rd.innerHTML='';d.slice(0,30).forEach(r=>{
      const div=document.createElement('div');div.className='sr';
      div.innerHTML='<span>'+(r.displayName||r.nameCh||r.name||r.nameEn)+'</span> <span style="color:#8b949e">'+(r.fullPathName||r.regionType||'')+'</span>';
      rd.appendChild(div);
    });
  }catch(e){rd.innerHTML='<div class="sr" style="color:#f85149">'+e.message+'</div>';}
}

function onLangChange(){init();}
init();

// Patch cascade: when country is selected, also trigger tree load
const origOnCascade=onCascade;
onCascade=function(level){
  origOnCascade(level);
  if(level===0){
    const sel=document.getElementById('sel-0');const v=sel.value;
    if(v){const m=countryMeta[parseInt(v)];if(m)onCountryChange(m.iso2);}
  }
};
</script>
</body>
</html>
